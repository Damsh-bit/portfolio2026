# Plantilla para el repo de cada proyecto personal (opcional).
# Copiala a .github/workflows/notify-portfolio.yml en ese repo para que el
# portfolio se actualice apenas pusheás, en vez de esperar al cron de 6 horas.
#
# Requiere el secret PORTFOLIO_DISPATCH_TOKEN en el repo del proyecto: un
# fine-grained token con acceso SOLO a Damsh-bit/portfolio2026 y permiso
# "Contents: Read and write" (es lo que pide GitHub para repository_dispatch).
name: Avisar al portfolio

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → portfolio2026
        env:
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Damsh-bit/portfolio2026/dispatches \
            -d "{\"event_type\":\"project-updated\",\"client_payload\":{\"repo\":\"$REPO\"}}"
